# 每天下載財政部營業登記資料，切成小檔，發布到 GitHub Pages
name: 更新公司資料

on:
  schedule:
    - cron: '0 21 * * *' # 台灣時間每天 05:00（財政部約 02:00 更新）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node test/run.mjs
      - name: 下載財政部資料
        run: curl -fsSL --retry 3 --retry-delay 30 --max-time 1200 -o BGMOPEN1.csv https://eip.fia.gov.tw/data/BGMOPEN1.csv
      - run: node scripts/build-shards.mjs BGMOPEN1.csv site
      - run: cp public/index.html site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
