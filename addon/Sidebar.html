<!doctype html>
<html>
<head>
<base target="_top">
<style>
  :root { --ink: #202124; --muted: #5f6368; --line: #dadce0; --soft: #f1f3f4; --accent: #1a73e8; --accent-soft: #e8f0fe; --accent-ink: #fff; --ok: #188038; --bad: #c5221f; --warn-bg: #fff4c2; --bad-bg: #fde2e1; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.5 Arial, "Noto Sans TC", sans-serif; color: var(--ink); }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tab { flex: 1; padding: 10px 4px; text-align: center; border: 0; background: none; font: inherit; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
  .tab.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: bold; }
  .pane { display: none; padding: 16px; }
  .pane.on { display: block; }
  h2 { font-size: 14px; margin: 18px 0 8px; }
  h2:first-child { margin-top: 0; }
  select, input[type=search] { width: 100%; padding: 6px 8px; font: inherit; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink); }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; }
  label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .check { margin-top: 10px; }
  button.main { margin-top: 18px; width: 100%; padding: 9px; font: inherit; font-weight: bold; border: 0; border-radius: 4px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  button.main:disabled { opacity: .55; cursor: default; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .result { margin-top: 14px; padding: 10px 12px; border-radius: 4px; background: var(--soft); display: none; }
  .result.show { display: block; }
  .ok { color: var(--ok); font-weight: bold; }
  .err { color: var(--bad); }
  .chip { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; border: 1px solid var(--line); }
  .search { display: flex; gap: 6px; }
  .search button { flex: none; padding: 0 12px; border: 1px solid var(--line); border-radius: 4px; background: #fff; font: inherit; cursor: pointer; }
  .cands { margin-top: 10px; }
  .cand { display: block; width: 100%; text-align: left; padding: 8px 10px; margin-bottom: 6px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font: inherit; cursor: pointer; }
  .cand:hover { border-color: var(--accent); background: var(--accent-soft); }
  .cand b { display: block; }
  .cand span { color: var(--muted); font-size: 12px; }
  .badge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 8px; background: var(--soft); color: var(--muted); margin-left: 4px; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0 16px; }
  .foot { margin: 8px 16px 16px; color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
  <div class="tabs">
    <button class="tab on" data-pane="byName">用名稱找統編</button>
    <button class="tab" data-pane="byId">用統編查公司</button>
  </div>

  <div class="pane on" id="byName">
    <h2>搜尋一家公司</h2>
    <div class="search">
      <input type="search" id="q" placeholder="例如：台積電、玉山銀行" aria-label="公司名稱">
      <button id="qGo">找</button>
    </div>
    <div class="hint">可以只打簡稱。點選結果，統編會填進目前選取的儲存格。</div>
    <div class="cands" id="cands"></div>

    <hr>

    <h2>整欄一起找</h2>
    <select id="nameCol" aria-label="公司名稱在哪一欄"><option>讀取中…</option></select>
    <label class="check"><input type="checkbox" id="nameHeader" checked> 第一列是標題</label>
    <button class="main" id="nameGo" disabled>開始找統編</button>
    <div class="hint">會在最右邊新增：統編、正式名稱、比對結果、其他可能。<br>黃色＝請確認，紅色＝查無。</div>
    <div class="result" id="nameResult"></div>
  </div>

  <div class="pane" id="byId">
    <h2>統編在哪一欄？</h2>
    <select id="col" aria-label="統編在哪一欄"><option>讀取中…</option></select>
    <div class="hint" id="colHint"></div>

    <h2>要填哪些資料？</h2>
    <div class="fields" id="fields"></div>
    <label class="check"><input type="checkbox" id="check" checked> 順便檢查統編有沒有打錯</label>

    <button class="main" id="go" disabled>開始填入</button>
    <div class="hint">結果會放在最右邊的新欄位，不會覆蓋原本的資料。</div>
    <div class="result" id="result"></div>
  </div>

  <div class="foot">資料來源：財政部全國營業(稅籍)登記資料集，每日更新，只含公司。</div>

<script>
  var DEFAULT_FIELDS = ['名稱', '地址', '組織別'];
  var $ = function (id) { return document.getElementById(id); };
  var run = function (ok, fail) { return google.script.run.withSuccessHandler(ok).withFailureHandler(fail); };

  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('on', x === t); });
      document.querySelectorAll('.pane').forEach(function (p) { p.classList.toggle('on', p.id === t.dataset.pane); });
    });
  });

  function columnOptions(info, selected) {
    return info.columns.map(function (c) {
      var label = c.letter + ' 欄' + (c.header ? '：' + c.header : '');
      return '<option value="' + c.index + '"' + (c.index === selected ? ' selected' : '') + '>' + esc(label) + '</option>';
    }).join('');
  }

  function render(info) {
    if (!info.columns.length) {
      $('col').innerHTML = $('nameCol').innerHTML = '<option>這個工作表是空的</option>';
      $('colHint').textContent = '先在某一欄貼上資料，再重新開啟面板。';
    } else {
      $('col').innerHTML = columnOptions(info, info.guess);
      $('nameCol').innerHTML = columnOptions(info, info.nameGuess);
      $('colHint').textContent = info.guess ? '已自動選出看起來像統編的那一欄。' : '找不到像統編的欄位，請手動選。';
      $('go').disabled = $('nameGo').disabled = false;
    }
    $('fields').innerHTML = info.fields.map(function (f) {
      return '<label><input type="checkbox" value="' + f + '"' + (DEFAULT_FIELDS.indexOf(f) >= 0 ? ' checked' : '') + '> ' + f + '</label>';
    }).join('');
  }

  // 搜尋一家
  function search() {
    var q = $('q').value.trim();
    if (!q) return;
    $('cands').innerHTML = '<div class="hint">搜尋中…</div>';
    run(showCands, function (e) { $('cands').innerHTML = '<div class="err">' + esc(msg(e)) + '</div>'; }).searchCompanyName(q);
  }
  function showCands(res) {
    if (res.status === 'vague') { $('cands').innerHTML = '<div class="err">名稱太籠統，多打幾個字試試。</div>'; return; }
    if (!res.candidates.length) { $('cands').innerHTML = '<div class="err">查無，可能不是公司、已不營業，或名稱差太多。</div>'; return; }
    $('cands').innerHTML = res.candidates.map(function (c, i) {
      var tags = (i === 0 && res.confident ? '<span class="badge">最可能</span>' : '') + (c.branch ? '<span class="badge">分公司</span>' : '');
      return '<button class="cand" data-id="' + c.id + '"><b>' + esc(c.name) + tags + '</b><span>' + c.id + (c.capital ? '　資本額 ' + money(c.capital) : '') + '</span></button>';
    }).join('');
  }
  $('cands').addEventListener('click', function (e) {
    var b = e.target.closest('.cand'); if (!b) return;
    run(function (a1) {
      b.querySelector('span').textContent = '✓ 已填入 ' + a1 + '：' + b.dataset.id;
    }, function (e) { alert(msg(e)); }).writeToActiveCell(b.dataset.id);
  });
  $('qGo').addEventListener('click', search);
  $('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') search(); });

  // 整欄用名稱找
  $('nameGo').addEventListener('click', function () {
    var btn = busy($('nameGo'), '找統編中…');
    run(function (s) {
      btn.done('開始找統編');
      var lines = ['<span class="ok">完成</span>，填在 ' + s.firstColumn + '–' + s.lastColumn + ' 欄', '確定 ' + s.confident + ' 家'];
      if (s.check) lines.push('<span class="chip" style="background:var(--warn-bg)"></span>請確認 ' + s.check + ' 家（看「其他可能」那欄）');
      if (s.notFound) lines.push('<span class="chip" style="background:var(--bad-bg)"></span>查無 ' + s.notFound + ' 家');
      show('nameResult', lines.join('<br>'));
    }, function (e) { btn.done('開始找統編'); show('nameResult', '<span class="err">' + esc(msg(e)) + '</span>'); })
      .fillCompanyIds({ column: Number($('nameCol').value), hasHeader: $('nameHeader').checked });
  });

  // 整欄用統編查
  $('go').addEventListener('click', function () {
    var fields = Array.prototype.map.call(document.querySelectorAll('#fields input:checked'), function (el) { return el.value; });
    var btn = busy($('go'), '查詢中…');
    run(function (s) {
      btn.done('開始填入');
      var lines = ['<span class="ok">完成</span>，填在 ' + s.firstColumn + (s.lastColumn !== s.firstColumn ? '–' + s.lastColumn : '') + ' 欄', '查到 ' + s.found + ' 家'];
      if (s.notFound) lines.push('<span class="chip" style="background:var(--warn-bg)"></span>查無 ' + s.notFound + ' 家（可能不是公司或已不營業）');
      if (s.invalid) lines.push('<span class="chip" style="background:var(--bad-bg)"></span>統編格式錯誤 ' + s.invalid + ' 筆');
      show('result', lines.join('<br>'));
    }, function (e) { btn.done('開始填入'); show('result', '<span class="err">' + esc(msg(e)) + '</span>'); })
      .fillCompanyData({ column: Number($('col').value), fields: fields, check: $('check').checked });
  });

  function busy(btn, text) {
    btn.disabled = true; btn.textContent = text;
    return { done: function (t) { btn.disabled = false; btn.textContent = t; } };
  }
  function show(id, html) { $(id).innerHTML = html; $(id).className = 'result show'; }
  function msg(e) { return e && e.message ? e.message : String(e); }
  function money(n) { return n >= 1e8 ? (Math.round(n / 1e7) / 10) + ' 億' : n >= 1e4 ? Math.round(n / 1e4) + ' 萬' : n + ' 元'; }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }

  run(render, function (e) { show('nameResult', '<span class="err">' + esc(msg(e)) + '</span>'); }).getSheetInfo();
</script>
</body>
</html>
